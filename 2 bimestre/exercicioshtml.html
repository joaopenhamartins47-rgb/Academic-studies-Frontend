<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1</title>
    <style>
        /* Estilo básico para a div ter um tamanho visível na tela */
        #minhaDiv {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            margin-top: 20px;
            transition: background-color 0.3s; /* Deixa a troca de cor mais suave */
        }
    </style>
</head>
<body>

    <label for="seletorCor">Escolha a cor da caixa:</label>
    <!-- Os valores (value) das options estão em inglês para o CSS entender as cores nativamente -->
    <select id="seletorCor">
        <option value="white">Selecione...</option>
        <option value="blue">Azul</option>
        <option value="green">Verde</option>
        <option value="red">Vermelho</option>
        <option value="yellow">Amarelo</option>
    </select>

    <!-- A div que vai mudar de cor -->
    <div id="minhaDiv"></div>

    <script>
        // 1. Selecionamos o select e a div no HTML
        var seletor = document.querySelector("#seletorCor");
        var minhaDiv = document.querySelector("#minhaDiv");

        // 2. Adicionamos o evento 'change' (mudança) ao select
        seletor.addEventListener("change", function() {
            // 3. Pegamos o valor atual do select (seletor.value) 
            // e aplicamos na cor de fundo (backgroundColor) da div
            minhaDiv.style.backgroundColor = seletor.value;
        }, false);
    </script>



    <!--Exercicio 2-->
    <!-- Elemento que exibe o número inicial (0) -->
    <h1 id="visorNumero">0</h1>

    <!-- Botões para incrementar e decrementar -->
    <button id="btnIncrementar">Incrementar</button>
    <button id="btnDecrementar">Decrementar</button>

    <script>
        var numero = document.querySelector("#visorNumero");
        var num = parseInt(numero.innerHTML);

        var botao1 = document.querySelector("#btnIncrementar");
        var botao2 = document.querySelector("#btnDecrementar");


        function atualizar_cor()
        {
            if(num % 2 == 0)
            {
                numero.style.color = "blue";
            }   
            else
                numero.style.color = "green";
        }
        botao1.addEventListener("click", function(){
            num++;
            numero.innerHTML = num;
            atualizar_cor();
        });
        botao2.addEventListener("click", function(){
            if(num > 0)
            {
                num--;
            }
            numero.innerHTML = num;
            atualizar_cor();
        });
        
    </script>


    <!--Exercicio 3-->
    <!-- Exibição no formato 00:00 exigido na lista -->
    <h1 id="visorTempo">00:00</h1>
    <button id="btnIniciar">Iniciar</button>
    <button id="btnZerar">Zerar</button>
    <script>
        var visor = document.getElementById("visorTempo");
        var btnIniciar = document.getElementById("btnIniciar");
        var btnZerar = document.getElementById("btnZerar");
        var segundos = 0;
        var minutos = 0;
        var intervaloCronometro; // Variável para guardar o processo do setInterval

        function formatarTempo(min, seg) {
            var minFormatado = min < 10 ? "0" + min : min;
            var segFormatado = seg < 10 ? "0" + seg : seg;
            return minFormatado + ":" + segFormatado;
        }

        btnIniciar.addEventListener("click", function() {
            
            clearInterval(intervaloCronometro); 

            // Inicia a repetição e guarda a "chave" dela na variável
            intervaloCronometro = setInterval(function() {
                segundos++; 

                if (segundos === 60) { // Bateu 60 segundos, vira 1 minuto
                    segundos = 0;
                    minutos++;
                }

                // Atualiza a tela com os valores novos já formatados
                visor.innerHTML = formatarTempo(minutos, segundos); 
            }, 1000); // 1000 milissegundos de intervalo
        });

        btnZerar.addEventListener("click", function() {
            // 1. Para o processo de repetição na memória
            clearInterval(intervaloCronometro); 
            
            // 2. Zera a matemática
            segundos = 0; 
            minutos = 0;
            
            // 3. Zera o visual da tela
            visor.innerHTML = "00:00"; 
        });
    </script>
</body>
</html>
