<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Rede de Apoio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funcoes.js"></script>
</head>
<body onload="carregarTipoUsuario()">
    <div id="toastCadastro" class="alert alert-success position-fixed shadow" style="top: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; align-items: center; gap: 15px; background-color: #eaf4ed; border-color: #167c5d; color: #167c5d; opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s;">
        <span class="fw-bold">Conta criada com sucesso! Redirecionando para o login...</span>
        <button type="button" class="btn-close" onclick="document.getElementById('toastCadastro').style.opacity='0'; setTimeout(function(){ document.getElementById('toastCadastro').style.visibility='hidden'; }, 400);"></button>
    </div>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="logo">♡</span> Rede de Apoio <small>Saúde Mental</small>
            </a>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li><a class="nav-link" href="index.html">Início</a></li>
                    <li><a class="nav-link" href="sobre.html">Sobre</a></li>
                    <li><a class="nav-link" href="voluntarios.html">Voluntários</a></li>
                    <li><a class="nav-link" href="artigos.html">Artigos</a></li>
                    <li><a class="nav-link" href="faq.html">FAQ</a></li>
                    <li><a class="nav-link" href="contato.html">Contato</a></li>
                    <li><a class="btn btn-outline-success ms-lg-2" href="login.html">Entrar</a></li>
                    <li><a class="btn btn-success ms-lg-2" href="cadastro.html">Cadastrar</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2 ms-lg-3 mt-3 mt-lg-0 border-start ps-lg-3 border-secondary-subtle">
                    <button onclick="aumentarFonte()" class="btn btn-sm btn-outline-secondary" title="Aumentar Fonte">A+</button>
                    <button onclick="diminuirFonte()" class="btn btn-sm btn-outline-secondary" title="Diminuir Fonte">A-</button>
                    <button onclick="saidaRapida()" class="btn btn-sm btn-danger fw-bold">Sair Rápido (ESC)</button>
                </div>
            </div>
        </div>
    </nav>
    <main class="page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card login-card shadow-sm p-4 p-lg-5 fade-up">
                        <h2 class="text-center mb-4">Crie sua conta</h2>
                        <form novalidate onsubmit="validarCadastro(event)">
                            <label class="form-label">E-mail</label>
                            <input type="email" id="emailCadastro" class="form-control mb-3" placeholder="seu@email.com">
                            <label class="form-label">Tipo de Conta</label>
                            <select id="tipoUsuario" class="form-select mb-3">
                                <option value="">Selecione...</option>
                                <option value="paciente">Quero buscar apoio</option>
                                <option value="voluntario">Quero ser voluntário</option>
                            </select>
                            <label class="form-label">Senha</label>
                            <input type="password" id="senhaCadastro" class="form-control mb-3" placeholder="Mínimo de 6 caracteres">
                            <label class="form-label">Confirmar Senha</label>
                            <input type="password" id="confirmaSenhaCadastro" class="form-control mb-4" placeholder="Repita a senha">
                            <div id="erroCadastro" class="text-danger small mb-3 fw-bold" style="display: none;"></div>
                            <button type="submit" class="btn btn-success w-100">Finalizar Cadastro</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="login.html" class="text-muted small">Já tem uma conta? Entre aqui.</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
