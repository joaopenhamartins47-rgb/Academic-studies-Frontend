<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Agendamento | Rede de Apoio</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
		<link rel="stylesheet" href="css/style.css">
		<script src="js/funcoes.js"></script>
	</head>
	<body onload="carregarProfissional()">
		<nav class="navbar navbar-expand-lg fixed-top">
			<div class="container">
				<a class="navbar-brand fw-bold" href="index.html">
					<span class="logo">♡</span> Rede de Apoio <small>Saúde Mental</small>
				</a>
			</div>
		</nav>
		<main class="page">
			<div class="container">
				<div class="mb-4">
					<span class="tag">AGENDAMENTO</span>
					<h1>Agendar atendimento</h1>
					<p class="text-muted">Escolha uma data e um horário disponível.</p>
				</div>
				<div class="row g-4">
					<div class="col-lg-4">
						<div class="card p-4 h-100">
							<div class="avatar" id="avatarProf">AS</div>
							<h3 id="nomeProf">Dra. Ana Souza</h3>
							<p class="text-success" id="tipoProf">Psicóloga Clínica</p>
							<p id="descProf">Ansiedade, depressão e autoestima.</p>
							<hr>
							<p><strong>Formato:</strong> Online</p>
							<p><strong>Duração:</strong> 50 minutos</p>
						</div>
					</div>
					<div class="col-lg-8">
						<div class="card p-4">
							<div id="areaComprovante"></div>
							<form id="formAgendamento" onsubmit="realizarAgendamento(event)">
								<input type="hidden" id="escolhaProfissional" value="Dra. Ana Souza">
								<label class="form-label">Selecione uma data</label>
								<input type="date" class="form-control mb-4" id="dataAgendamento" required>
								<h5>Horário</h5>
								<select id="horarioAgendamento" class="form-select mb-4" required>
									<option value="">Escolha um horário...</option>
									<option value="09:00">09:00</option>
									<option value="10:00">10:00</option>
									<option value="14:00">14:00</option>
									<option value="15:00">15:00</option>
									<option value="16:00">16:00</option>
								</select>
								<button type="submit" class="btn btn-success w-100">Confirmar agendamento</button>
							</form>
						</div>
					</div>
				</div>
			</div>
		</main>
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	</body>
</html>
