<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript">
        function exibir_mensagem()
        {
            alert("Ola mundo!");
        }
        function cumprimento(nome)
        {
            document.writeln('<h2> Ola ' + nome + '!');
        }
        function soma(a, b)
        {
            let num = parseInt(a);
            let num2 = parseInt(b);
            document.writeln('<h2>A soma de ' + num + '+' + num2 + '=' + (num+num2) + '</h2>');
        }
    </script>

</head>
<body>
    <div class="container">
        <button class="btn btn-primary" onclick="exibir_mensagem()">Clique aqui!</button>
    </div>
    <div class="container mt-3">
        <label for="mnome">Nome: </label>
        <input type="text" id="mnome" class="form-control">
        <input type="submit" value="Clique aqui para mostrar nome" onclick="cumprimento(document.getElementById('mnome').value)">
    </div>
    <div class="container">
        <label for="num1">Numero 1: </label>
        <input type="text" id="num1" class="form-control" name="num"> 
        <label for="num2">Numero 2: </label>
        <input type="text" id="num2" class="form-control" name="num2">
        <button onclick="soma(document.getElementById('num1').value, getElementById('num2').value)">Soma</button> 
    </div>
    
    
</body>
</html>
